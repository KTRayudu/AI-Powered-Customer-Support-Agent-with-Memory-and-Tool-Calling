[project]
name = "customer-support-agent-mem0-and-toolcalling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "python-dotenv",
  "langchain",
  "langchain-core",
  "langchain-groq",
  "langchain-text-splitters",
  "mem0ai",
  "chromadb",
  "streamlit",
  "requests",
  "email-validator",
  "google-genai",
  "guardrails-ai>=0.5",
  "spacy>=3.7",
  
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "playwright>=1.58.0",
  "pytest",
  "ragas>=0.2",
  "deepeval>=1.0",
  "rapidfuzz>=3.10",
]

[tool.pytest.ini_options]
markers = [
  "full_eval: marks the full RAG + agent evaluation suite",
]
filterwarnings = [
  "ignore:Importing NonLLMContextPrecisionWithReference from 'ragas.metrics' is deprecated:DeprecationWarning",
  "ignore:.*LangchainEmbeddingsWrapper is deprecated.*:DeprecationWarning",
  "ignore:.*LangchainLLMWrapper is deprecated.*:DeprecationWarning",
]
